services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ie_inspection
      POSTGRES_USER: ie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ie_inspect_change_me}
    volumes:
      - ie_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ie -d ie_inspection"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+psycopg://ie:${POSTGRES_PASSWORD:-ie_inspect_change_me}@db:5432/ie_inspection
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ie_data:/srv/data

volumes:
  ie_pg:
  ie_data:
